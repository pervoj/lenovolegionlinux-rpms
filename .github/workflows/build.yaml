name: Build RPMs and push to GHCR

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["Update Fedora and project versions"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild and push even if the version artifact already exists
        type: boolean
        default: false

env:
  OCI_REPO: ghcr.io/${{ github.repository }}

jobs:
  versions:
    runs-on: ubuntu-latest

    outputs:
      versions: ${{ steps.read-versions.outputs.versions }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read versions.yaml
        id: read-versions
        shell: bash
        run: |
          versions=$(yq -o=json -I=0 '.' versions.yaml)
          echo "versions=$versions" >> $GITHUB_OUTPUT

  build:
    needs: versions
    strategy:
      matrix:
        fedora-version: ${{ fromJSON(needs.versions.outputs.versions).fedora-versions }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    container:
      image: fedora:${{ matrix.fedora-version }}
      options: --privileged

    env:
      FEDORA_VERSION: ${{ matrix.fedora-version }}
      PROJECT_VERSION: ${{ fromJSON(needs.versions.outputs.versions).project-version }}

    steps:
      - name: Setup ORAS
        uses: oras-project/setup-oras@v2

      - name: Login to GHCR
        shell: bash
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Check for existing build
        id: check-existing
        shell: bash
        run: |
          OCI_TAG="f$FEDORA_VERSION-$PROJECT_VERSION"
          echo "OCI_TAG=$OCI_TAG" >> $GITHUB_ENV

          force_rebuild=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_rebuild }}" = "true" ]; then
            force_rebuild=true
          fi

          echo "REPO: $OCI_REPO:$OCI_TAG"
          if [ "$force_rebuild" = "true" ]; then
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Force rebuild requested, proceeding with build"
          elif oras manifest fetch "$OCI_REPO:$OCI_TAG" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "::notice::Skipping build, artifact with tag $OCI_TAG already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "No existing artifact for $OCI_TAG, proceeding with build"
          fi

      - name: Checkout repository
        if: steps.check-existing.outputs.exists != 'true'
        uses: actions/checkout@v7

      - name: Setup build environment
        if: steps.check-existing.outputs.exists != 'true'
        shell: bash
        run: |
          dnf install -y rpmdevtools
          mkdir -p ./rpms

      - name: Download source code
        if: steps.check-existing.outputs.exists != 'true'
        shell: bash
        run: |
          curl -fsSL "https://github.com/johnfanv2/LenovoLegionLinux/archive/refs/tags/$PROJECT_VERSION.tar.gz" -o ./source.tar.gz
          mkdir -p ./source
          tar -xzf ./source.tar.gz -C ./source --strip-components=1
          rm -f ./source.tar.gz

      - name: Build "dkms-LenovoLegionLinux" RPM
        if: steps.check-existing.outputs.exists != 'true'
        uses: ./.github/actions/build-rpm
        with:
          specfile: ./source/deploy/build_packages/lenovolegionlinux-dkms.spec
          outdir: ./rpms

      - name: Build "python-darkdetect" RPM
        if: steps.check-existing.outputs.exists != 'true'
        uses: ./.github/actions/build-rpm
        with:
          specfile: ./source/deploy/build_packages/darkdetect.spec
          outdir: ./rpms

      - name: Build "python-LenovoLegionLinux" RPM
        if: steps.check-existing.outputs.exists != 'true'
        uses: ./.github/actions/build-rpm
        with:
          specfile: ./source/deploy/build_packages/lenovolegionlinux.spec
          outdir: ./rpms

      - name: Push OCI artifact to GHCR
        if: steps.check-existing.outputs.exists != 'true'
        shell: bash
        working-directory: ./rpms
        run: |
          # Push versioned and rolling tags together so fN is not resolved from a
          # stale fN-vX.Y manifest immediately after overwrite (GHCR caching).
          oras push "$OCI_REPO:${OCI_TAG},f${FEDORA_VERSION}" ./*.rpm

      - name: Tag latest build for Fedora version
        if: steps.check-existing.outputs.exists == 'true'
        shell: bash
        run: |
          oras tag "$OCI_REPO:$OCI_TAG" "f$FEDORA_VERSION"
